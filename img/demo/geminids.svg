<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <rect width="640" height="360" fill="#04060d"/>
  <!-- Star trails -->
  <g stroke="#38bdf8" opacity="0.4" stroke-width="0.8">
    <line x1="320" y1="40" x2="180" y2="240"/>
    <line x1="320" y1="40" x2="230" y2="280"/>
    <line x1="320" y1="40" x2="310" y2="290"/>
    <line x1="320" y1="40" x2="390" y2="280"/>
    <line x1="320" y1="40" x2="460" y2="250"/>
