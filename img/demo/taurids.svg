<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <rect width="640" height="360" fill="#080b14"/>
  <!-- Stars background -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="90" r="1.2"/>
    <circle cx="210" cy="50" r="1.5"/>
    <circle cx="380" cy="80" r="1"/>
    <circle cx="500" cy="110" r="1.8"/>
    <circle cx="440" cy="220" r="1.2"/>
    <circle cx="150" cy="270" r="1.5"/>
  </g>
  <!-- Pleiades Cluster -->
  <g fill="#67e8f9" opacity="0.95">
    <circle cx="240" cy="110" r="2.5"/>
    <circle cx="248" cy="116" r="2"/>
    <circle cx="254" cy="112" r="2.2"/>
    <circle cx="260" cy="120" r="1.8"/>
    <circle cx="242" cy="124" r="2"/>
    <circle cx="236" cy="118" r="1.6"/>
  </g>
  <text x="240" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="11" opacity="0.8">Pleiades</text>
  <text x="360" y="160" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">Taurus</text>
  <!-- Bright Taurid Fireball Streak -->
  <line x1="420" y1="130" x2="160" y2="280" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="420" y1="130" x2="160" y2="280" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="160" cy="280" r="4" fill="#ffffff"/>
  <circle cx="160" cy="280" r="8" fill="#f97316" opacity="0.4"/>
</svg>
