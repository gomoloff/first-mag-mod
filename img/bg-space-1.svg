<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
    <radialGradient id="moonEarth" cx="80%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lunarGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmos Sky -->
  <rect width="1920" height="1080" fill="url(#skyGlow)"/>
  <rect width="1920" height="1080" fill="url(#moonEarth)"/>

  <!-- Distant Blue Earth / Moon Planet in upper sky -->
  <circle cx="1520" cy="180" r="70" fill="#0284c7" opacity="0.45"/>
  <circle cx="1520" cy="180" r="72" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1520 110 A 70 70 0 0 1 1560 240 A 70 70 0 0 0 1520 110" fill="#38bdf8" opacity="0.3"/>

  <!-- Twinkling stars -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="280" cy="140" r="1"/>
    <circle cx="90" cy="320" r="1.8"/>
    <circle cx="220" cy="450" r="1.2"/>
    <circle cx="340" cy="280" r="1.5"/>
    <circle cx="1680" cy="90" r="1.2"/>
    <circle cx="1820" cy="220" r="1.6"/>
    <circle cx="1740" cy="380" r="1.4"/>
    <circle cx="1880" cy="480" r="1"/>
    <circle cx="1600" cy="520" r="1.5"/>
  </g>

  <!-- Left Side: Lunar Ridge & Crashed Space Explorer / Crater -->
  <!-- Distant Crater Hill -->
  <path d="M -50 820 Q 140 760 360 840 T 520 920 L 520 1080 L -50 1080 Z" fill="#1e293b" opacity="0.85"/>
  <!-- Foreground Lunar Terrain -->
  <path d="M -50 880 Q 180 840 380 920 L 380 1080 L -50 1080 Z" fill="url(#lunarGround)"/>
  <!-- Spacecraft Silhouette on the Lunar Surface -->
  <polygon points="110,870 170,810 220,830 190,880" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <polygon points="130,810 160,760 175,810" fill="#0284c7" opacity="0.7"/>
  <line x1="170" y1="810" x2="230" y2="790" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="232" cy="788" r="4" fill="#38bdf8"/>
  <!-- Small Astronaut Silhouette -->
  <ellipse cx="250" cy="880" rx="3.5" ry="5" fill="#e2e8f0"/>
  <circle cx="250" cy="873" r="2.5" fill="#38bdf8"/>
  <line x1="250" y1="885" x2="248" y2="893" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="250" y1="885" x2="253" y2="893" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Right Side: Majestic Lunar Horizon -->
  <path d="M 1400 900 Q 1650 780 1980 850 L 1980 1080 L 1400 1080 Z" fill="#1e293b" opacity="0.85"/>
  <path d="M 1520 940 Q 1720 860 1980 910 L 1980 1080 L 1520 1080 Z" fill="url(#lunarGround)"/>
  <circle cx="1650" cy="940" r="14" fill="#0f172a" opacity="0.6"/>
  <ellipse cx="1800" cy="930" rx="28" ry="12" fill="#0f172a" opacity="0.5"/>
</svg>
