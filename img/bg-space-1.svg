<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="nebulaCyan" cx="70%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaIndigo" cx="25%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#e2e8f0" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="80" cy="0" r="1.5" fill="#3b82f6" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#nebulaCyan)"/>
  <rect width="1920" height="1080" fill="url(#nebulaIndigo)"/>
  <!-- Orbital arcs -->
  <path d="M -200 400 Q 600 -100 1400 300 T 2200 800" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="6 8" stroke-opacity="0.25"/>
  <path d="M 0 900 Q 800 600 1600 950" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.2"/>
  <circle cx="1100" cy="180" r="3" fill="#3b82f6" fill-opacity="0.5"/>
  <circle cx="1100" cy="180" r="14" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="350" cy="620" r="2.5" fill="#06b6d4" fill-opacity="0.6"/>
  <circle cx="350" cy="620" r="22" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.3"/>
</svg>
